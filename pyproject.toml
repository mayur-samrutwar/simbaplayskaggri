[project]
name = "simbaplayskaggri"
version = "0.1.0"
description = "Local research and evaluation project for the Kaggriculture agent competition"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "kaggle-environments==1.32.7",
]

[project.optional-dependencies]
dev = [
  "kaggle==2.2.4",
  "pytest==9.1.1",
]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = ["tests"]
